<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MyReminders</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e2230; --accent:#5b8cff;
    --accent2:#7c5bff; --text:#eef1f8; --muted:#8b93a7; --danger:#ff5b6e;
    --good:#3ddc84; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:linear-gradient(160deg,#0f1115,#151826 60%,#0f1115);
    color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .app{max-width:520px; margin:0 auto; padding:16px 14px 90px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  header h1{font-size:20px; margin:0;}
  header .sub{font-size:12px; color:var(--muted);}
  .tabs{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
  .tab{flex:0 0 auto; padding:8px 14px; border-radius:20px; background:var(--card);
    color:var(--muted); font-size:13px; white-space:nowrap; border:1px solid #262b3a;}
  .tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;}
  .cat-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; padding-bottom:4px;}
  .cat-chip{flex:0 0 auto; padding:6px 12px; border-radius:14px; background:var(--card2);
    font-size:13px; border:1px solid #262b3a; display:flex; align-items:center; gap:6px;}
  .cat-chip.selected{outline:2px solid var(--accent);}
  .task-card{background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:10px;
    border:1px solid #232838; position:relative;}
  .task-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .task-title{font-size:15px; font-weight:600;}
  .task-meta{font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap;}
  .badge{background:var(--card2); padding:2px 8px; border-radius:10px; font-size:11px; color:var(--text);}
  .task-notes{font-size:13px; color:#c7cce0; margin-top:8px; white-space:pre-wrap;}
  .task-actions{display:flex; gap:10px; margin-top:10px;}
  .icon-btn{background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px;}
  .icon-btn.del{color:var(--danger);}
  .empty{text-align:center; color:var(--muted); margin-top:60px; font-size:14px;}
  .fab{position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom,0px));
    width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff; font-size:28px; border:none; box-shadow:0 8px 24px rgba(91,140,255,.4); z-index:20;}
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:30;
    align-items:flex-end;}
  .sheet-bg.open{display:flex;}
  .sheet{background:var(--card); width:100%; max-width:520px; margin:0 auto; border-radius:20px 20px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto;}
  .sheet h2{margin:0 0 14px; font-size:17px;}
  label{font-size:12px; color:var(--muted); display:block; margin:12px 0 6px;}
  input[type=text], textarea, select, input[type=date], input[type=time]{
    width:100%; background:var(--card2); border:1px solid #2a3040; color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit;}
  textarea{min-height:70px; resize:vertical;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .emoji-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;}
  .emoji-opt{font-size:20px; background:var(--card2); border:1px solid #2a3040; border-radius:10px;
    padding:6px 8px; cursor:pointer;}
  .emoji-opt.sel{outline:2px solid var(--accent);}
  .btn{width:100%; padding:12px; border:none; border-radius:12px; font-size:15px; font-weight:600;
    margin-top:18px; cursor:pointer;}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff;}
  .btn.secondary{background:var(--card2); color:var(--text); margin-top:8px;}
  .btn.danger{background:rgba(255,91,110,.15); color:var(--danger); margin-top:8px;}
  .row-inline{display:flex; gap:8px; align-items:center;}
  .cat-manage-item{display:flex; align-items:center; justify-content:space-between;
    background:var(--card2); padding:8px 10px; border-radius:10px; margin-bottom:8px;}
  .notif-banner{position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:10px; right:10px;
    background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:14px;
    z-index:50; display:none; box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .notif-banner.show{display:block;}
  .notif-banner .t{font-weight:700; font-size:15px;}
  .notif-banner .n{font-size:13px; color:var(--muted); margin-top:4px;}
  .notif-banner .row-inline{margin-top:12px;}
  .notif-banner button{flex:1; padding:10px; border-radius:10px; border:none; font-size:14px; font-weight:600;}
  .b-snooze{background:var(--card2); color:var(--text);}
  .b-done{background:var(--good); color:#0f1115;}
</style>
</head>
<body>

<div class="notif-banner" id="notifBanner">
  <div class="t" id="nbTitle">⏰ Reminder</div>
  <div class="n" id="nbNote"></div>
  <div class="row-inline">
    <button class="b-snooze" onclick="snoozeCurrent()">Snooze 10 min</button>
    <button class="b-done" onclick="dismissCurrent()">Dismiss</button>
  </div>
</div>

<div class="app">
  <header>
    <div>
      <h1>MyReminders</h1>
      <div class="sub">Work · Tasks · Meds · Brand · Meetings · Reports</div>
    </div>
    <button class="icon-btn" style="font-size:22px" onclick="openCatManager()">🏷️</button>
  </header>

  <div class="tabs" id="filterTabs"></div>
  <div class="cat-row" id="catRow"></div>
  <button class="btn secondary" style="margin-top:-6px; margin-bottom:14px;" onclick="openCatManager()">🏷️ Add / Manage Categories</button>

  <div id="taskList"></div>
</div>

<button class="fab" onclick="openTaskSheet()">＋</button>

<!-- Task add/edit sheet -->
<div class="sheet-bg" id="taskSheetBg" onclick="closeIfBg(event,'taskSheetBg')">
  <div class="sheet">
    <h2 id="taskSheetTitle">New Reminder</h2>
    <input type="hidden" id="editTaskId">
    <label>Title</label>
    <input type="text" id="fTitle" placeholder="e.g. Send collection report">
    <label>Notes</label>
    <textarea id="fNotes" placeholder="Details, links, account names..."></textarea>
    <label>Category</label>
    <select id="fCategory"></select>
    <label>Repeat</label>
    <select id="fRepeat">
      <option value="once">One time</option>
      <option value="daily">Daily</option>
      <option value="weekly">Weekly</option>
      <option value="monthly">Monthly</option>
      <option value="quarterly">Quarterly</option>
    </select>
    <div class="grid2">
      <div>
        <label>Date</label>
        <input type="date" id="fDate">
      </div>
      <div>
        <label>Time</label>
        <input type="time" id="fTime">
      </div>
    </div>
    <button class="btn primary" onclick="saveTask()">Save Reminder</button>
    <button class="btn secondary" onclick="closeSheet('taskSheetBg')">Cancel</button>
    <button class="btn danger" id="deleteTaskBtn" style="display:none" onclick="deleteCurrentTask()">Delete Reminder</button>
  </div>
</div>

<!-- Category manager sheet -->
<div class="sheet-bg" id="catSheetBg" onclick="closeIfBg(event,'catSheetBg')">
  <div class="sheet">
    <h2>Categories</h2>
    <div id="catManageList"></div>
    <label>New category name</label>
    <input type="text" id="newCatName" placeholder="e.g. Personal">
    <label>Pick emoji</label>
    <div class="emoji-row" id="emojiPicker"></div>
    <button class="btn primary" onclick="addCategory()">Add Category</button>
    <button class="btn secondary" onclick="closeSheet('catSheetBg')">Close</button>
  </div>
</div>

<audio id="alarmSound" loop>
  <source src="alarm_tone.mp3" type="audio/mpeg">
</audio>

<script>
/* ---------- Storage ---------- */
const STORE_KEY = 'mr_tasks_v1';
const CAT_KEY = 'mr_categories_v1';

const DEFAULT_CATS = [
  {id:'work', name:'Work', emoji:'💼'},
  {id:'tasks', name:'Tasks', emoji:'✅'},
  {id:'meds', name:'Medication', emoji:'💊'},
  {id:'brand', name:'Brand', emoji:'🏷️'},
  {id:'meetings', name:'Meetings', emoji:'🤝'},
  {id:'reports', name:'Reports', emoji:'📊'},
];

const EMOJI_CHOICES = ['💼','✅','💊','🏷️','🤝','📊','📌','🎯','💰','📅','🔔','📞','✈️','🏠','🎓','🛒','⚡','❤️','🧠','🍎'];

function loadCats(){
  let c = JSON.parse(localStorage.getItem(CAT_KEY) || 'null');
  if(!c){ c = DEFAULT_CATS; localStorage.setItem(CAT_KEY, JSON.stringify(c)); }
  return c;
}
function saveCats(c){ localStorage.setItem(CAT_KEY, JSON.stringify(c)); }
function loadTasks(){ return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
function saveTasks(t){ localStorage.setItem(STORE_KEY, JSON.stringify(t)); }

let categories = loadCats();
let tasks = loadTasks();
let activeFilter = 'today';
let activeCat = null;
let selectedEmoji = EMOJI_CHOICES[0];

/* ---------- Rendering ---------- */
function uid(){ return 't' + Date.now() + Math.floor(Math.random()*1000); }

function renderFilterTabs(){
  const el = document.getElementById('filterTabs');
  const filters = [
    ['today','Today'], ['upcoming','Upcoming'], ['all','All']
  ];
  el.innerHTML = filters.map(([id,label]) =>
    `<div class="tab ${activeFilter===id?'active':''}" onclick="setFilter('${id}')">${label}</div>`
  ).join('');
}
function setFilter(id){ activeFilter = id; render(); }

function renderCatRow(){
  const el = document.getElementById('catRow');
  el.innerHTML = `<div class="cat-chip ${activeCat===null?'selected':''}" onclick="setCat(null)">🗂️ All</div>` +
    categories.map(c =>
      `<div class="cat-chip ${activeCat===c.id?'selected':''}" onclick="setCat('${c.id}')">${c.emoji} ${c.name}</div>`
    ).join('');
}
function setCat(id){ activeCat = id; render(); }

function catById(id){ return categories.find(c=>c.id===id) || {emoji:'📌', name:'Other'}; }

function nextOccurrenceLabel(t){
  const d = new Date(t.nextAt);
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'}) +
    ' · ' + d.toLocaleTimeString(undefined,{hour:'2-digit', minute:'2-digit'});
}
function repeatLabel(r){
  return {once:'One time', daily:'Daily', weekly:'Weekly', monthly:'Monthly', quarterly:'Quarterly'}[r] || r;
}

function render(){
  renderFilterTabs();
  renderCatRow();
  const el = document.getElementById('taskList');
  const now = Date.now();
  let list = tasks.filter(t=>t.active !== false);
  if(activeCat) list = list.filter(t=>t.category===activeCat);
  if(activeFilter==='today'){
    const start = new Date(); start.setHours(0,0,0,0);
    const end = new Date(); end.setHours(23,59,59,999);
    list = list.filter(t=> t.nextAt>=start.getTime() && t.nextAt<=end.getTime());
  } else if(activeFilter==='upcoming'){
    list = list.filter(t=> t.nextAt >= now);
  }
  list.sort((a,b)=>a.nextAt-b.nextAt);

  if(list.length===0){
    el.innerHTML = `<div class="empty">No reminders here yet 🙂<br>Tap + to add one.</div>`;
    return;
  }
  el.innerHTML = list.map(t=>{
    const c = catById(t.category);
    return `<div class="task-card">
      <div class="task-top">
        <div>
          <div class="task-title">${c.emoji} ${escapeHtml(t.title)}</div>
          <div class="task-meta">
            <span class="badge">${nextOccurrenceLabel(t)}</span>
            <span class="badge">${repeatLabel(t.repeat)}</span>
            <span class="badge">${c.name}</span>
          </div>
        </div>
      </div>
      ${t.notes ? `<div class="task-notes">${escapeHtml(t.notes)}</div>` : ''}
      <div class="task-actions">
        <button class="icon-btn" onclick="openTaskSheet('${t.id}')">✏️ Edit</button>
        <button class="icon-btn del" onclick="quickDelete('${t.id}')">🗑️ Delete</button>
      </div>
    </div>`;
  }).join('');
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- Task sheet ---------- */
function refreshCategorySelect(){
  const sel = document.getElementById('fCategory');
  sel.innerHTML = categories.map(c=>`<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('');
}
function openTaskSheet(taskId){
  refreshCategorySelect();
  const bg = document.getElementById('taskSheetBg');
  document.getElementById('deleteTaskBtn').style.display = taskId ? 'block' : 'none';
  if(taskId){
    const t = tasks.find(x=>x.id===taskId);
    document.getElementById('taskSheetTitle').textContent = 'Edit Reminder';
    document.getElementById('editTaskId').value = t.id;
    document.getElementById('fTitle').value = t.title;
    document.getElementById('fNotes').value = t.notes||'';
    document.getElementById('fCategory').value = t.category;
    document.getElementById('fRepeat').value = t.repeat;
    const d = new Date(t.nextAt);
    document.getElementById('fDate').value = toDateInput(d);
    document.getElementById('fTime').value = toTimeInput(d);
  } else {
    document.getElementById('taskSheetTitle').textContent = 'New Reminder';
    document.getElementById('editTaskId').value = '';
    document.getElementById('fTitle').value = '';
    document.getElementById('fNotes').value = '';
    document.getElementById('fRepeat').value = 'once';
    const now = new Date(Date.now()+15*60000);
    document.getElementById('fDate').value = toDateInput(now);
    document.getElementById('fTime').value = toTimeInput(now);
  }
  bg.classList.add('open');
}
function toDateInput(d){ return d.toISOString().slice(0,10); }
function toTimeInput(d){ return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function closeSheet(id){ document.getElementById(id).classList.remove('open'); }
function closeIfBg(e, id){ if(e.target.id===id) closeSheet(id); }

function saveTask(){
  const id = document.getElementById('editTaskId').value || uid();
  const title = document.getElementById('fTitle').value.trim();
  if(!title){ alert('Please enter a title'); return; }
  const notes = document.getElementById('fNotes').value.trim();
  const category = document.getElementById('fCategory').value;
  const repeat = document.getElementById('fRepeat').value;
  const date = document.getElementById('fDate').value;
  const time = document.getElementById('fTime').value;
  const dt = new Date(date+'T'+time+':00');

  let t = tasks.find(x=>x.id===id);
  if(!t){ t = {id, active:true}; tasks.push(t); }
  t.title = title; t.notes = notes; t.category = category; t.repeat = repeat;
  t.baseAt = dt.getTime();
  t.nextAt = dt.getTime();
  saveTasks(tasks);
  scheduleTask(t);
  closeSheet('taskSheetBg');
  render();
}
function quickDelete(id){
  if(!confirm('Delete this reminder?')) return;
  tasks = tasks.filter(t=>t.id!==id);
  saveTasks(tasks);
  cancelTaskNotifications(id);
  render();
}
function deleteCurrentTask(){
  const id = document.getElementById('editTaskId').value;
  if(id) quickDelete(id);
  closeSheet('taskSheetBg');
}

/* ---------- Category manager ---------- */
function openCatManager(){
  renderCatManageList();
  renderEmojiPicker();
  document.getElementById('catSheetBg').classList.add('open');
}
function renderCatManageList(){
  const el = document.getElementById('catManageList');
  el.innerHTML = categories.map(c=>`
    <div class="cat-manage-item">
      <span>${c.emoji} ${c.name}</span>
      <button class="icon-btn del" onclick="removeCategory('${c.id}')">🗑️</button>
    </div>`).join('');
}
function renderEmojiPicker(){
  const el = document.getElementById('emojiPicker');
  el.innerHTML = EMOJI_CHOICES.map(e=>
    `<div class="emoji-opt ${e===selectedEmoji?'sel':''}" onclick="pickEmoji('${e}')">${e}</div>`
  ).join('');
}
function pickEmoji(e){ selectedEmoji = e; renderEmojiPicker(); }
function addCategory(){
  const name = document.getElementById('newCatName').value.trim();
  if(!name){ alert('Enter a category name'); return; }
  const id = 'c' + Date.now();
  categories.push({id, name, emoji:selectedEmoji});
  saveCats(categories);
  document.getElementById('newCatName').value = '';
  renderCatManageList();
  renderCatRow();
}
function removeCategory(id){
  if(!confirm('Remove this category? Its tasks will move to the first category.')) return;
  categories = categories.filter(c=>c.id!==id);
  if(categories.length===0){ categories = [DEFAULT_CATS[0]]; }
  saveCats(categories);
  tasks.forEach(t=>{ if(t.category===id) t.category = categories[0].id; });
  saveTasks(tasks);
  renderCatManageList();
  render();
}

/* ---------- Recurrence math ---------- */
function computeOccurrences(t, count){
  const out = [];
  let d = new Date(t.baseAt);
  const now = Date.now();
  // if base is in the past for a repeating task, advance to next future occurrence first
  while(d.getTime() < now && t.repeat !== 'once'){
    d = advance(d, t.repeat);
  }
  for(let i=0;i<count;i++){
    out.push(new Date(d));
    if(t.repeat === 'once') break;
    d = advance(d, t.repeat);
  }
  return out;
}
function advance(d, repeat){
  const nd = new Date(d);
  if(repeat==='daily') nd.setDate(nd.getDate()+1);
  else if(repeat==='weekly') nd.setDate(nd.getDate()+7);
  else if(repeat==='monthly') nd.setMonth(nd.getMonth()+1);
  else if(repeat==='quarterly') nd.setMonth(nd.getMonth()+3);
  return nd;
}
function occurrenceCountFor(repeat){
  return {once:1, daily:30, weekly:26, monthly:24, quarterly:12}[repeat] || 1;
}
function notifIdFor(taskId, idx){
  // simple stable hash into 31-bit int
  let str = taskId+'_'+idx;
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) & 0x7fffffff; }
  return h;
}

/* ---------- Native scheduling (Capacitor Local Notifications) ---------- */
function hasNative(){ return !!(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications); }

const ALARM_CHANNEL_ID = 'reminders_alarm_v3_mp3fix';
// The Android sound file must live at: android/app/src/main/res/raw/alarm_tone.mp3
// (lowercase letters, numbers, underscores only in the filename — no spaces/dashes).
const CUSTOM_SOUND = 'alarm_tone.mp3';

async function requestPermissions(){
  if(!hasNative()) return;
  try{
    await window.Capacitor.Plugins.LocalNotifications.requestPermissions();
    await window.Capacitor.Plugins.LocalNotifications.registerActionTypes({
      types:[{
        id:'REMINDER_ACTIONS',
        actions:[
          {id:'snooze', title:'Snooze 10 min'},
          {id:'done', title:'Dismiss'}
        ]
      }]
    });
    // Max-importance channel with a custom ringtone: pops up as a heads-up alert
    // with your own sound + vibration even while the phone is locked or another app is open.
    await window.Capacitor.Plugins.LocalNotifications.createChannel({
      id: ALARM_CHANNEL_ID,
      name: 'Reminders (Custom tone)',
      description: 'Loud pop-up reminders with your own sound and vibration',
      importance: 5,
      visibility: 1,
      vibration: true,
      lights: true,
      sound: CUSTOM_SOUND
    });
  }catch(e){ console.log('perm error', e); }
}

async function cancelTaskNotifications(taskId){
  if(!hasNative()) return;
  const ids = [];
  for(let i=0;i<30;i++) ids.push({id: notifIdFor(taskId,i)});
  try{ await window.Capacitor.Plugins.LocalNotifications.cancel({notifications:ids}); }catch(e){}
}

async function scheduleTask(t){
  if(!hasNative()) return; // web preview mode: in-app checker below still works while open
  await cancelTaskNotifications(t.id);
  const occ = computeOccurrences(t, occurrenceCountFor(t.repeat));
  if(occ.length===0) return;
  t.nextAt = occ[0].getTime();
  saveTasks(tasks);
  const c = catById(t.category);
  const notifs = occ.map((d,i)=>({
    id: notifIdFor(t.id, i),
    title: `${c.emoji} ${t.title}`,
    body: t.notes || repeatLabel(t.repeat)+' reminder',
    schedule: { at: d, allowWhileIdle: true },
    channelId: ALARM_CHANNEL_ID,
    sound: CUSTOM_SOUND,
    actionTypeId: 'REMINDER_ACTIONS',
    extra: { taskId: t.id, occIndex: i }
  }));
  try{
    await window.Capacitor.Plugins.LocalNotifications.schedule({ notifications: notifs });
  }catch(e){ console.log('schedule error', e); }
}

async function rescheduleAll(){
  for(const t of tasks){ if(t.active!==false) await scheduleTask(t); }
  render();
}

function listenForActions(){
  if(!hasNative()) return;
  window.Capacitor.Plugins.LocalNotifications.addListener('localNotificationActionPerformed', async (payload)=>{
    const taskId = payload?.notification?.extra?.taskId;
    if(!taskId) return;
    const t = tasks.find(x=>x.id===taskId);
    if(!t) return;
    if(payload.actionId === 'snooze'){
      const snoozeAt = new Date(Date.now()+10*60000);
      const id = notifIdFor(taskId, 999) + Math.floor(Math.random()*100);
      try{
        await window.Capacitor.Plugins.LocalNotifications.schedule({ notifications:[{
          id, title: payload.notification.title, body: payload.notification.body,
          schedule:{ at: snoozeAt, allowWhileIdle: true }, channelId: ALARM_CHANNEL_ID,
          actionTypeId:'REMINDER_ACTIONS', extra:{taskId, occIndex:-1}
        }]});
      }catch(e){}
    }
  });
}

/* ---------- Fallback: in-app popup while the app is open (works even without native build) ---------- */
let currentAlarmTask = null;
function checkDueLoop(){
  const now = Date.now();
  for(const t of tasks){
    if(t.active===false) continue;
    if(t.nextAt <= now && !t._firedInApp){
      t._firedInApp = true;
      showBanner(t);
      // advance nextAt locally for repeating tasks so UI stays sensible until native reschedule kicks in
      if(t.repeat!=='once'){
        t.nextAt = advance(new Date(t.nextAt), t.repeat).getTime();
      }
      saveTasks(tasks);
    }
  }
  render();
}
function showBanner(t){
  currentAlarmTask = t;
  document.getElementById('nbTitle').textContent = `⏰ ${t.title}`;
  document.getElementById('nbNote').textContent = t.notes || repeatLabel(t.repeat);
  document.getElementById('notifBanner').classList.add('show');
  const audio = document.getElementById('alarmSound');
  audio.play().catch(()=>{});
  if('vibrate' in navigator) navigator.vibrate([300,150,300,150,300]);
}
function hideBanner(){
  document.getElementById('notifBanner').classList.remove('show');
  document.getElementById('alarmSound').pause();
  document.getElementById('alarmSound').currentTime = 0;
}
function dismissCurrent(){ hideBanner(); currentAlarmTask=null; }
function snoozeCurrent(){
  if(currentAlarmTask){
    currentAlarmTask.nextAt = Date.now()+10*60000;
    currentAlarmTask._firedInApp = false;
    saveTasks(tasks);
  }
  hideBanner();
}

/* ---------- Init ---------- */
async function init(){
  refreshCategorySelect();
  await requestPermissions();
  listenForActions();
  render();
  await rescheduleAll();
  setInterval(checkDueLoop, 20000);
}
init();
</script>
